<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru EzyDraw</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            600: '#059669',
                            700: '#047857',
                        },
                        violet: {
                            600: '#7c3aed',
                        },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-4xl">
    <div class="grid grid-cols-1 md:grid-cols-2">

        <!-- SISI KIRI -->
        <div class="hidden md:flex flex-col items-center justify-center p-10 bg-emerald-600 text-white space-y-6">
            <div class="bg-white p-3 rounded-full shadow-lg">
                <img src="../static/img/logo.png"
                     alt="Logo Aplikasi EzyDraw"
                     class="w-24 h-24 rounded-full object-cover">
            </div>

            <h1 class="text-4xl font-extrabold text-center">Bergabunglah Sekarang!</h1>
            <p class="text-center text-emerald-100">
                Buat akun Anda dalam hitungan detik. Nikmati akses penuh ke semua fitur kami.
            </p>
        </div>

        <!-- SISI KANAN -->
        <div class="p-8 md:p-12 space-y-6">

            <div class="space-y-4">
                <div class="flex justify-center">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M42 21V28M42 28V35M42 28H49M42 28H35M30.3333 16.3333C30.3333 18.8087 29.35 21.1827 27.5997 22.933C25.8493 24.6833 23.4754 25.6667 21 25.6667C18.5246 25.6667 16.1507 24.6833 14.4003 22.933C12.65 21.1827 11.6667 18.8087 11.6667 16.3333C11.6667 13.858 12.65 11.484 14.4003 9.73367C16.1507 7.98333 18.5246 7 21 7C23.4754 7 25.8493 7.98333 27.5997 9.73367C29.35 11.484 30.3333 13.858 30.3333 16.3333ZM7 46.6667C7 42.9536 8.475 39.3927 11.1005 36.7672C13.726 34.1417 17.287 32.6667 21 32.6667C24.713 32.6667 28.274 34.1417 30.8995 36.7672C33.525 39.3927 35 42.9536 35 46.6667V49H7V46.6667Z" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                </div>

                <h2 class="text-3xl font-extrabold text-center text-gray-900">
                    Buat Akun Baru
                </h2>
            </div>

            <!-- FORM REGISTER -->
            <form class="space-y-4" onsubmit="handleRegister(event)">

                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Nama Lengkap
                    </label>
                    <input id="full_name" type="text" required
                           class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Email
                    </label>
                    <input id="email" type="email" required
                           class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Kata Sandi
                    </label>
                    <input id="password" type="password" required
                           class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Konfirmasi Kata Sandi
                    </label>
                    <input id="confirm_password" type="password" required
                           class="w-full px-3 py-2 border rounded-md">
                </div>

                <div class="flex items-center">
                    <input id="terms" type="checkbox" required class="mr-2">
                    <label class="text-sm text-gray-700">
                        Saya setuju dengan syarat dan ketentuan
                    </label>
                </div>

                <button type="submit"
                        class="w-full py-2 text-white rounded-md bg-emerald-600 hover:bg-emerald-700">
                    Daftar Sekarang
                </button>
            </form>

            <p class="text-center text-sm text-gray-600">
                Sudah punya akun?
                <a href="login.html" class="text-violet-600 font-medium">
                    Masuk di sini
                </a>
            </p>

        </div>
    </div>
</div>

<!-- LOGIC REGISTER -->
<script>
function handleRegister(event) {
    event.preventDefault();

    const fullName = document.getElementById('full_name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;

    if (password !== confirm) {
        alert('Kata sandi tidak sama!');
        return;
    }

    const users = JSON.parse(localStorage.getItem('ezydraw_users')) || [];

    const exists = users.find(u => u.email === email);
    if (exists) {
        alert('Email sudah terdaftar!');
        return;
    }

    users.push({
        fullName,
        email,
        password
    });

    localStorage.setItem('ezydraw_users', JSON.stringify(users));

    alert('Registrasi berhasil! Silakan login.');
    window.location.href = 'login.html';
}
</script>

</body>
</html>
