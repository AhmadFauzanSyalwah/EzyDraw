<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EzyDraw</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <!-- Tailwind Custom Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                        emerald: {
                            600: '#059669',
                        },
                        yellow: {
                            400: '#facc15',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<!-- ======================================================
     CONTAINER UTAMA
====================================================== -->
<div class="bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-4xl">
    <div class="grid grid-cols-1 md:grid-cols-2">

        <!-- ======================================================
             PANEL KIRI – BRANDING / WELCOME
        ======================================================= -->
        <div class="hidden md:flex flex-col items-center justify-center p-10 bg-violet-600 text-white space-y-6">

            <div class="bg-white p-3 rounded-full shadow-lg">
                <img src="../static/img/logo.png"
                     alt="Logo EzyDraw"
                     class="w-24 h-24 rounded-full object-cover">
            </div>

            <h1 class="text-4xl font-extrabold text-center">
                Selamat Datang Kembali
            </h1>

            <p class="text-center text-violet-100 leading-relaxed">
                Masuk ke EzyDraw dan lanjutkan proyek desain Anda
                dengan pengalaman editor desktop yang cepat,
                ringan, dan sepenuhnya offline-first.
            </p>

        </div>

        <!-- ======================================================
             PANEL KANAN – FORM LOGIN
        ======================================================= -->
        <div class="p-8 md:p-12 space-y-8">

            <!-- HEADER -->
            <div class="space-y-4 text-center">
                <div class="flex justify-center">
                    <svg width="40" height="40" viewBox="0 0 34 46" fill="none">
                        <path d="M16.5 21C21.7467 21 26 16.7467 26 11.5C26 6.25329 21.7467 2 16.5 2C11.2533 2 7 6.25329 7 11.5C7 16.7467 11.2533 21 16.5 21Z"
                              stroke="#7c3aed" stroke-width="4"/>
                        <path d="M32 44C32 39.4972 30.1579 35.1788 27.3448 31.9948
                                 C24.2414 28.9987 20.9782 28 17 28
                                 C13.0218 28 9.46822 28.8108 6.65517 31.9948
                                 C3.84213 35.1788 2 39.4972 2 44H32Z"
                              stroke="#7c3aed" stroke-width="4"/>
                    </svg>
                </div>

                <h2 class="text-3xl font-extrabold text-gray-900">
                    Masuk ke Akun
                </h2>
            </div>

            <!-- ======================================================
                 FORM LOGIN
            ======================================================= -->
            <form id="loginForm" class="space-y-6">

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Email
                    </label>
                    <input type="email"
                           id="email"
                           required
                           class="mt-1 block w-full px-3 py-2 border rounded-md
                                  focus:outline-none focus:ring-2
                                  focus:ring-yellow-400 focus:border-violet-600">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Kata Sandi
                    </label>
                    <input type="password"
                           id="password"
                           required
                           class="mt-1 block w-full px-3 py-2 border rounded-md
                                  focus:outline-none focus:ring-2
                                  focus:ring-yellow-400 focus:border-violet-600">
                </div>

                <!-- Remember -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="remember"
                               class="text-violet-600 focus:ring-yellow-400">
                        <span class="text-sm">Ingat saya</span>
                    </label>

                    <a href="#" class="text-sm text-violet-600 hover:text-yellow-400">
                        Lupa kata sandi?
                    </a>
                </div>

                <!-- Button -->
                <button type="submit"
                        class="w-full py-2 px-4 text-white font-medium rounded-md
                               bg-violet-600 hover:bg-violet-700
                               transition">
                    Masuk
                </button>
            </form>

            <!-- ======================================================
                 FOOTER LINK
            ======================================================= -->
            <p class="text-center text-sm text-gray-600">
                Belum punya akun?
                <a href="register.html"
                   class="font-medium text-violet-600 hover:text-yellow-400">
                    Daftar di sini
                </a>
            </p>

        </div>
    </div>
</div>

<!-- ======================================================
     SCRIPT LOGIN LOGIC (SIMULASI)
====================================================== -->
<script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const remember = document.getElementById('remember').checked;

        const userSession = {
            email: email,
            loginTime: new Date().toISOString()
        };

        if (remember) {
            localStorage.setItem('ezydraw_user', JSON.stringify(userSession));
        } else {
            sessionStorage.setItem('ezydraw_user', JSON.stringify(userSession));
        }

        window.location.href = 'dashboard.html';
    });
</script>

</body>
</html>
